version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: smartinvoice_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartinvoice
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: smartinvoice_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/smartinvoice
      SECRET_KEY: smartinvoice_secret_key_2026_muy_segura
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-SmartInvoice}
      UPLOAD_DIR: uploads
      REPORTS_DIR: reports
    volumes:
      - uploads_data:/app/uploads
      - reports_data:/app/reports
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  reports_data:
